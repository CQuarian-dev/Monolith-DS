# One cavern under each world, built at depth -1 with its planet network while wg.caverns is on.
# Mouths: each hole is grown from its own seed to the world's style and size range (CAVERNS_DESIGN.md 3.3).
# Avoid also lists each world's rock-outcrop spawner, so no mouth is walled in by an outcrop.

- type: wgCavern
  id: WGCavernAsclepiu
  surface: WGSurfaceAsclepiu
  name: wg-cavern-asclepiu-name
  level: WGCavernAsclepiuLevel
  seedOffset: 7901
  roofColor: "#070a08"
  shaftLight: 0.5
  ambience: WGCavernAmbienceAsclepiu
  mouths:
    style: Blob
    minTiles: 14
    maxTiles: 30
    elongation: 1.6
    roughness: 0.35
    cellSize: 96
    groundTiles: [FloorPlanetGrass, FloorPlanetDirt, FloorSnow, WGFloorVerdaMeadowGrass, WGFloorVerdaForestGrass, WGFloorVerdaSnowRough]
    avoid: [CEWater, MonoPlanetmapOreBase, MonoPlanetmapOreSnow] # LuaM: CE water on every world
    landingTile: WGCavernFloorPoolbed
    landingEntity: CEWater # LuaM: CE water on every world
    shade: WGCavernShadeAsclepiu
    stairs: WGCavernStairsAsclepiu
    rim: [FloraRockSolid]
    rimCount: 2

