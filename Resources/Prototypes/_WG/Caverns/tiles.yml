# Landing tiles: what lies under each mouth. The fall multipliers soften or harden the one-level drop.

- type: tile
  id: WGCavernFloorAsh
  edgeSpritePriority: 0 # LuaM: soft borders between planet ground tiles
  edgeSprites: # LuaM
    SouthEast: /Textures/_LuaM/Tiles/Edges/Tiles_cavedrought_SouthEast.png
    NorthEast: /Textures/_LuaM/Tiles/Edges/Tiles_cavedrought_NorthEast.png
    NorthWest: /Textures/_LuaM/Tiles/Edges/Tiles_cavedrought_NorthWest.png
    SouthWest: /Textures/_LuaM/Tiles/Edges/Tiles_cavedrought_SouthWest.png
    South: /Textures/_LuaM/Tiles/Edges/Tiles_cavedrought_South.png
    East: /Textures/_LuaM/Tiles/Edges/Tiles_cavedrought_East.png
    North: /Textures/_LuaM/Tiles/Edges/Tiles_cavedrought_North.png
    West: /Textures/_LuaM/Tiles/Edges/Tiles_cavedrought_West.png
  parent: FloorCaveDrought
  indestructible: true
  deconstructTools: []
  baseTurf: ""
  fallDamageMultiplier: 0.75
  fallStunMultiplier: 0.75

- type: tile
  id: WGCavernFloorSandDrift
  parent: FloorAsteroidSand
  indestructible: true
  deconstructTools: []
  baseTurf: ""
  fallDamageMultiplier: 0.5
  fallStunMultiplier: 0.5

