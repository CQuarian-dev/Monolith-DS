# Cavern floors inherit their parent's look and name. Each is indestructible, can't be dug and has no base turf, so
# no tool, blast or acid opens the bottom layer to void.

- type: tile
  id: WGCavernFloorLimestone
  edgeSpritePriority: -2 # LuaM: soft borders between planet ground tiles
  parent: FloorCave
  indestructible: true
  deconstructTools: []
  baseTurf: ""

- type: tile
  id: WGCavernFloorSand
  edgeSpritePriority: 0 # LuaM: soft borders between planet ground tiles
  edgeSprites: # LuaM
    SouthEast: /Textures/_LuaM/Tiles/Edges/Tiles_Asteroid_asteroid_SouthEast.png
    NorthEast: /Textures/_LuaM/Tiles/Edges/Tiles_Asteroid_asteroid_NorthEast.png
    NorthWest: /Textures/_LuaM/Tiles/Edges/Tiles_Asteroid_asteroid_NorthWest.png
    SouthWest: /Textures/_LuaM/Tiles/Edges/Tiles_Asteroid_asteroid_SouthWest.png
    South: /Textures/_LuaM/Tiles/Edges/Tiles_Asteroid_asteroid_South.png
    East: /Textures/_LuaM/Tiles/Edges/Tiles_Asteroid_asteroid_East.png
    North: /Textures/_LuaM/Tiles/Edges/Tiles_Asteroid_asteroid_North.png
    West: /Textures/_LuaM/Tiles/Edges/Tiles_Asteroid_asteroid_West.png
  parent: FloorAsteroidSand
  indestructible: true
  deconstructTools: []
  baseTurf: ""

