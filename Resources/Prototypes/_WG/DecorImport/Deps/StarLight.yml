# _StarLight/Entities/Structures/Lighting/ground_lighting.yml
- type: entity
  id: FloorLight
  suffix: Always Powered
  parent: BaseStructure
  components:
    - type: Sprite
      sprite: _Paradise/Structures/Lighting/floorlights.rsi
      snapCardinals: false
      drawdepth: FloorObjects
      noRot: true
      layers:
        - map: ["enum.PoweredLightLayers.Base"]
          state: base
        - map: ["enum.PoweredLightLayers.Glow"]
          state: glow
          shader: unshaded
      state: base
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeCircle
            radius: 0.1
          density: 100
          mask:
            - None
          layer:
            - TabletopMachineLayer
    - type: PointLight
      radius: 10
      energy: 2.5
      softness: 0.9
      color: "#FFE4CE"
    - type: InteractionOutline
    - type: Damageable
      damageModifierSet: Metallic
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetSteel1:
                  min: 1
                  max: 1
            - !type:EmptyAllContainersBehaviour
            - !type:PlaySoundBehavior
              sound:
                collection: MetalGlassBreak
    - type: StaticPrice
      price: 75
    - type: RequireProjectileTarget
    - type: Icon
      sprite: _Paradise/Structures/Lighting/floorlights.rsi
