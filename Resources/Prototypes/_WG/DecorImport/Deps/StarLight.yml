# LuaM: prototypes DecorImport furniture and its construction recipes need, from Wolfgate's StarLight content.

# _StarLight/Entities/Structures/Furniture/Tables/round_tables.yml
- type: entity
  id: RoundTableCarpet
  parent: BaseStructure
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Furniture/Tables/roundtable.rsi
    state: round_carpet
    snapCardinals: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: [ Destruction ]
  - type: Construction
    graph: DecorBuildRoundTableCarpet
    node: built
  - type: Anchorable
  - type: Transform
  - type: PlaceableSurface
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask: [ TableMask ]
        layer: [ TableLayer ]
  - type: Climbable
  - type: Clickable
  - type: Bonkable
    bonkDamage:
      types:
        Blunt: 3
  - type: StaticPrice
    price: 30
  - type: Icon
    sprite: _Starlight/Structures/Furniture/Tables/roundtable.rsi
    state: round_carpet

