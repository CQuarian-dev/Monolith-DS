# LuaM: prototypes DecorImport furniture and its construction recipes need, from Wolfgate's ADT content.

# ADT/Entities/Structures/Furniture/beds.yml
- type: entity
  parent: Bed
  id: ADTDeckChair
  components:
  - type: Sprite
    sprite: ADT/Structures/Furniture/deckchair.rsi
    noRot: false
    state: deckchair
  - type: Construction
    graph: DecorBuildADTDeckChair
    node: built
  - type: Strap
    position: Down
    rotation: -90
    buckleOffset: "0,-0.15"
  - type: Icon
    sprite: ADT/Structures/Furniture/deckchair.rsi
    state: deckchair

# ADT/Entities/Structures/Furniture/benchs.yml
- type: entity
  id: ADTBenchChurchLeftSide
  parent: SeatBase
  components:
  - type: Sprite
    sprite: ADT/Structures/Furniture/bench_church.rsi
    state: bench_left
    snapCardinals: false
  - type: Construction
    graph: DecorBuildADTBenchChurchLeftSide
    node: built
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Rotatable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Physics
    bodyType: Static
  - type: StaticPrice
    price: 30.0
  - type: Icon
    sprite: ADT/Structures/Furniture/bench_church.rsi
    state: bench_left

