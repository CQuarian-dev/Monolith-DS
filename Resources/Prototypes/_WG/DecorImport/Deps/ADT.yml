  parent: [ SeatBase, BaseStructure ]
  components:
  - type: Sprite
    sprite: ADT/Structures/Furniture/Chairs/chairs.rsi
    state: pizza_chair
    snapCardinals: false
  - type: Construction
    graph: DecorBuildADTChairPizzeria
    node: built
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Rotatable
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb {}
        density: 190
        mask: [ TableMask ]
  - type: HealOnBuckle
    damage:
      types:
        Poison: -0.1
        Blunt: -0.1
  - type: Strap
    position: Down
    rotation: 0
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Physics
    bodyType: Static
  - type: StaticPrice
    price: 30.0
  - type: Icon
    sprite: ADT/Structures/Furniture/Chairs/chairs.rsi
    state: pizza_chair

