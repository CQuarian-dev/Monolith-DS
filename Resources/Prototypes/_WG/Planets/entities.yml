# Orbit layer centre marker: a warp point and radar label, deliberately without an FTLBeacon.

- type: entity
  id: WGOrbitBeacon
  name: Orbital marker # Renamed at spawn
  categories: [ HideSpawnMenu ]
  components:
    - type: WarpPoint
      adminOnly: true
    - type: FTLSmashImmune
    - type: IFF
      color: '#7FFFD4'
    # A hull moving over the marker would otherwise reparent it and carry it off.
    - type: Transform
      gridTraversal: false
