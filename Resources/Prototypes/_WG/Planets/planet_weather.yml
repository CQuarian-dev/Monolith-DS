# A thunderbolt: one flash, one crack, gone.
- type: entity
  id: WGThunderbolt
  categories: [ HideSpawnMenu ]
  name: thunderbolt
  components:
  - type: Sprite
    sprite: /Textures/_WG/Planets/Effects/thunderbolt.rsi
    state: thunderbolt
    offset: 0, 1
    drawdepth: Effects
    noRot: true
    shader: unshaded
  - type: PointLight
    radius: 14
    energy: 10
    color: "#cfe4ff"
    netsync: false
  - type: TimedDespawn
    lifetime: 0.6

# A far flash's bolt, drawn by the client somewhere in view; the server never spawns it.
- type: entity
  parent: WGThunderbolt
  id: WGThunderboltFar
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/_WG/Planets/Effects/thunderbolt.rsi
    state: thunderbolt
    offset: 0, 1
    drawdepth: Effects
    noRot: true
    shader: unshaded
    color: "#dfe8ffcc"
  - type: PointLight
    radius: 10
    energy: 6
    color: "#cfe4ff"
    netsync: false

# The thunder is played by the strike itself, at the spot: it outlasts the bolt by seconds.
- type: soundCollection
  id: WGThunder
  files:
  - /Audio/_WG/Planets/Weather/thunder_1.ogg
  - /Audio/_WG/Planets/Weather/thunder_2.ogg
