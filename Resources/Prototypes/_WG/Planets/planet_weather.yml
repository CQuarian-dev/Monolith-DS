# Carcinoma's red haze and fog came from WolfWeather's first schedule.
- type: wgPlanetWeather
  id: WGPlanetWeatherCarcinoma
  planetType: WGPlanetCarcinoma
  storms:
  - main: WGBloodRain
  - main: WGBloodHaze
  - telegraph: WGBloodHaze
    main: WGBloodFog
    end: WGBloodHaze
  - telegraph: WGBloodRain
    main: WGBloodStorm
    end: WGBloodRain
  wolfWeathers:
    WGBloodRain: WGBloodRainModerate
    WGBloodStorm: WGBloodStorm
    WGBloodHaze: WGBloodHaze
    WGBloodFog: WGBloodFog
  initialHour: 21
  # Body-warm and nearly steady; no seasons.
  dayTemperatureSwing: 1
  weatherTemperature:
    WGBloodRain: -1
    WGBloodStorm: -2
    WGBloodFog: -1

# Overlays and rain loops from /tg/station (weather_effects.dmi, sound/ambience/weather/rain).
- type: weather
  id: WGRainLow
  sprite:
    sprite: /Textures/_WG/Planets/Effects/weather_tg.rsi
    state: rain_low
  sound:
