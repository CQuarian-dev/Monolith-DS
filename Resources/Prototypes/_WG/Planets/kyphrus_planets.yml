# LuaM: selected on the server and replicated as the sector system ID.
- type: starSystem
  id: WGSystemKyphrus
  star: StarKyphrus
  planets:
    - planet: PlanetFervidus
      distance: 6200
      angle: 0.35
    - planet: PlanetMerak
      distance: 9400
      angle: 1.15
    - planet: PlanetAsclepiu
      name: Verda
      distance: 11500
      angle: 2.4
    - planet: PlanetAerumna
      distance: 14000
      angle: 3.55
    - planet: PlanetThrascias
      distance: 14500
      angle: 4.6

    - planet: WGPlanetCarcinoma
      distance: 14500
      angle: 0.0
