# Planet-specific open terrain. Existing art, ore tables and biome layers; no upstream recipe changes.
# Entity layers resolve from bottom to top: hazards/scenery win over wildlife, so animals spawn in clearings.
# Low-frequency rock masks form occasional outcrops instead of a continuous wall field.

# Fervidus: black basalt flats, ashfields (WGFervidusAshFields, Biomes/fervidus.yml) and lava channels with a crust of cooled rock.
- type: biomeTemplate
  id: WGOpenBasalt
  layers:
  - !type:BiomeTileLayer
    tile: FloorBasalt
    threshold: -1
  # Ashfields cover about a third of the surface: ash tiles, flora and small tar and sulfur pools.
  - !type:BiomeMetaLayer
    template: WGFervidusAshFields
    threshold: 0.12
    noise: { seed: 51, noiseType: OpenSimplex2, frequency: 0.007, fractalType: FBm, octaves: 2 }
  # A crust of cooled rock round every lava channel: the lava noise at a lower threshold.
  - !type:BiomeTileLayer
    tile: WGFloorFervidusAshRock
    threshold: 0.84
    noise: { seed: 3, noiseType: OpenSimplex2, frequency: 0.008, fractalType: Ridged, octaves: 1 }
  # Wildlife and spitting flowers of that crust: the same noise, so they stay in the band round the lava.
  # Scattered volcanic rock, a layer for each kind; lit vents and siderite growths are the rarer sort.
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WGFloorFervidusAshDust, WGFloorFervidusAshRock, WGFloorFervidusAshDirt]
    entities: [GoonFakeobjectRockpile]
    threshold: 0.985
    noise: { seed: 71, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WGFloorFervidusAshDust, WGFloorFervidusAshRock, WGFloorFervidusAshDirt]
    entities: [GoonFakeobjectRockpileBig]
    threshold: 0.985
    noise: { seed: 72, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WGFloorFervidusAshDust, WGFloorFervidusAshRock, WGFloorFervidusAshDirt]
    entities: [CMRockBlackGroundDense]
    threshold: 0.985
    noise: { seed: 73, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WGFloorFervidusAshDust, WGFloorFervidusAshRock, WGFloorFervidusAshDirt]
    entities: [CMRockBlackGroundDense3]
    threshold: 0.985
    noise: { seed: 74, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WGFloorFervidusAshDust, WGFloorFervidusAshRock, WGFloorFervidusAshDirt]
    entities: [TgFloraRockVolcano]
    threshold: 0.99
    noise: { seed: 75, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WGFloorFervidusAshDust, WGFloorFervidusAshRock, WGFloorFervidusAshDirt]
    entities: [TgFloraRockSideriteGrowth]
    threshold: 0.99
    noise: { seed: 76, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WGFloorFervidusAshDust, WGFloorFervidusAshRock, WGFloorFervidusAshDirt]
    entities: [BasaltOne, BasaltTwo, BasaltThree]
    threshold: 0.97
    noise: { seed: 2, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WGFloorFervidusAshDust, WGFloorFervidusAshRock, WGFloorFervidusAshDirt]
    entities: [MonoPlanetmapOreBasalt]
    threshold: 0.65
    noise: { seed: 11, noiseType: OpenSimplex2, frequency: 0.022 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WGFloorFervidusAshDust, WGFloorFervidusAshRock, WGFloorFervidusAshDirt]
    entities: [FloorLavaEntity]
    threshold: 0.94
    noise: { seed: 3, noiseType: OpenSimplex2, frequency: 0.008, fractalType: Ridged, octaves: 1 }

- type: biomeTemplate
  id: WGShadowClearings
  layers:
  - !type:BiomeTileLayer
    tile: FloorChromite
    threshold: -1
  # Shrouded clay flats between the groves, with patches of bare rock; chromite shows through elsewhere.
  - !type:BiomeTileLayer
    tile: WGFloorAerumnaDusk
    threshold: -0.08
    noise: { seed: 61, noiseType: OpenSimplex2, frequency: 0.011, fractalType: FBm, octaves: 2 }
  - !type:BiomeTileLayer
    tile: WGFloorAerumnaClay
    threshold: 0.1
    noise: { seed: 61, noiseType: OpenSimplex2, frequency: 0.011, fractalType: FBm, octaves: 2 }
  - !type:BiomeTileLayer
    tile: WGFloorAerumnaClayRock
    threshold: 0.5
    noise: { seed: 61, noiseType: OpenSimplex2, frequency: 0.011, fractalType: FBm, octaves: 2 }
  - !type:BiomeMetaLayer
    template: WGShadowGrove
    threshold: 0.35
    noise: { seed: 16, noiseType: OpenSimplex2, frequency: 0.018 }
  # The fungal forest and its shrouded ground.
  - !type:BiomeMetaLayer
    template: WGAerumnaFungalForest
    threshold: 0.4
    noise: { seed: 71, noiseType: OpenSimplex2, frequency: 0.009, fractalType: FBm, octaves: 2 }
  - !type:BiomeMetaLayer
    template: WGAerumnaBoulderField
    threshold: 0.55
    noise: { seed: 89, noiseType: OpenSimplex2, frequency: 0.014 }
  - !type:BiomeMetaLayer
    template: WGAerumnaRuinPocket
    threshold: 0.88
    noise: { seed: 97, noiseType: OpenSimplex2, frequency: 0.045 }
  - !type:BiomeTileLayer
    tile: WGFloorAerumnaDusk
    threshold: 0.7
    noise: { seed: 83, noiseType: OpenSimplex2, frequency: 0.010 }
  - !type:BiomeMetaLayer
    template: WGAerumnaCrystalSpires
    threshold: 0.82
    noise: { seed: 83, noiseType: OpenSimplex2, frequency: 0.010 }
  # The xenonid hive, last so its ground wins where regions overlap; a dusk band rings it, on the hive's own noise.
  - !type:BiomeTileLayer
    tile: WGFloorAerumnaDusk
    threshold: 0.48
    noise: { seed: 131, noiseType: OpenSimplex2, frequency: 0.012, fractalType: FBm, octaves: 2 }
  - !type:BiomeMetaLayer
    template: WGAerumnaHive
    threshold: 0.6
    noise: { seed: 131, noiseType: OpenSimplex2, frequency: 0.012, fractalType: FBm, octaves: 2 }
  # Lone stones scattered over the flats.
  - !type:BiomeEntityLayer
    allowedTiles: [FloorChromite, WGFloorAerumnaClay, WGFloorAerumnaClayRock, WGFloorAerumnaDusk]
    entities: [GoonStone2, GoonStone3, GoonStone4, GoonStone5, DarkPackFloraRockDarkpack]
    threshold: 0.965
    noise: { seed: 91, noiseType: OpenSimplex2, frequency: 4 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorChromite, WGFloorAerumnaClay, WGFloorAerumnaClayRock, WGFloorAerumnaDusk, WGFloorAerumnaCrystalBed]
    entities: [CrystalPink]
    threshold: 0.985
    noise: { seed: 2, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorChromite, WGFloorAerumnaClay, WGFloorAerumnaClayRock, WGFloorAerumnaDusk]
    entities: [MonoPlanetmapOreChromite]
    threshold: 0.72
    noise: { seed: 19, noiseType: OpenSimplex2, frequency: 0.025 }
  # Pools in the clearings, a dozen tiles or so across.
  - !type:BiomeEntityLayer
    allowedTiles: [FloorChromite, WGFloorAerumnaClay, WGFloorAerumnaClayRock, WGFloorAerumnaDusk, WGFloorAerumnaShroud, WGFloorAerumnaCrystalBed, WGFloorAerumnaHive]
    entities: [CEWater] # LuaM: CE water on every world
    threshold: 0.75
    noise: { seed: 41, noiseType: OpenSimplex2, frequency: 0.016, fractalType: FBm, octaves: 2 }

- type: biomeTemplate
  id: WGShadowGrove
  layers:
  - !type:BiomeEntityLayer
    allowedTiles: [FloorChromite, WGFloorAerumnaClay, WGFloorAerumnaClayRock, WGFloorAerumnaDusk]
    entities: [ShadowTree, ShadowBasaltOne, ShadowBasaltTwo]
    threshold: 0.65
    noise: { seed: 5, noiseType: OpenSimplex2, frequency: 1 }

# WGOpenSnow (Thrascias) moved to Biomes/thrascias.yml as WGThrasciasTerrain.

- type: biomeTemplate
  id: WGTemperatePlains
  layers:
  - !type:BiomeTileLayer
    tile: FloorPlanetGrass
    threshold: -1
  # Meadow patches in a livelier green, a darker floor under the woodland, dirt, and a mud ring round each pond.
  - !type:BiomeTileLayer
    tile: WGFloorVerdaMeadowGrass
    threshold: 0.35
    noise: { seed: 61, noiseType: OpenSimplex2, frequency: 0.005 }
  - !type:BiomeTileLayer
    tile: WGFloorVerdaForestGrass
    threshold: 0.25
    noise: { seed: 17, noiseType: OpenSimplex2, frequency: 0.005 }
  - !type:BiomeTileLayer
    tile: FloorPlanetDirt
    threshold: 0.72
    noise: { seed: 6, noiseType: OpenSimplex2, frequency: 0.01 }
  - !type:BiomeTileLayer
    tile: WGFloorVerdaPondMud
    threshold: 0.76
    noise: { seed: 41, noiseType: OpenSimplex2, frequency: 0.03, fractalType: FBm, octaves: 2 }
  # Decals go first: a decal layer that passes blocks every entity layer listed before it.
  # LuaM-start: sparse grass tufts under everything else, so open grass is never bare
  - !type:BiomeDecalLayer
    allowedTiles: [FloorPlanetGrass, WGFloorVerdaMeadowGrass, WGFloorVerdaForestGrass]
    decals: [Grassa1, Grassa2, Grassa3, Grassa4, Grassa5, Grassb1, Grassb2, Grassb3, Grassb4, Grassb5, Grassd1, Grassd2, Grassd3]
    threshold: 0.35
    noise: { seed: 260, noiseType: OpenSimplex2, frequency: 3 }
  # LuaM-end
  - !type:BiomeDecalLayer
    allowedTiles: [WGFloorVerdaMeadowGrass]
    decals: [AuroraDecalFloorDecalKonyangFlowers]
    threshold: 0.75
    noise: { seed: 64, noiseType: OpenSimplex2, frequency: 4 }
  # Wildlife by region (Planets/Life/verda_mobs.yml): meadow, woods and the pond shores.
  # Wildflower meadows.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorVerdaMeadowGrass]
    decals: [LuaMFloraCoyoteWildPlantFlowerBlue, LuaMFloraCoyoteWildPlantFlowerOrange]
    threshold: 0.84
    noise: { seed: 201, noiseType: OpenSimplex2, frequency: 5 }
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorVerdaMeadowGrass]
    decals: [LuaMFloraCoyoteWildPlantFlowerPink, LuaMFloraCoyoteWildPlantFlowerPurple]
    threshold: 0.84
    noise: { seed: 202, noiseType: OpenSimplex2, frequency: 5 }
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorVerdaMeadowGrass]
    decals: [LuaMFloraCoyoteWildPlantFlowerRed, LuaMFloraCoyoteWildPlantFlowerWhite]
    threshold: 0.84
    noise: { seed: 203, noiseType: OpenSimplex2, frequency: 5 }
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorVerdaMeadowGrass]
    decals: [LuaMFloraCoyoteWildPlantFlowerYellowhite]
    threshold: 0.84
    noise: { seed: 204, noiseType: OpenSimplex2, frequency: 5 }
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorVerdaMeadowGrass]
    decals: [LuaMFloraDarkPackFloraDarkpackFlowerMarigold]
    threshold: 0.84
    noise: { seed: 205, noiseType: OpenSimplex2, frequency: 5 }
  # Bees and snakes stand where a wildflower or a clump of tall grass would (same noise, a higher threshold, listed after).
  - !type:BiomeMetaLayer
    template: WGTemperateWoodland
    threshold: 0.2
    noise: { seed: 17, noiseType: OpenSimplex2, frequency: 0.005 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetGrass, FloorPlanetDirt, WGFloorVerdaMeadowGrass, WGFloorVerdaForestGrass]
    entities: [MonoPlanetmapOreBase]
    threshold: 0.72
    noise: { seed: 11, noiseType: OpenSimplex2, frequency: 0.02 }
  # Reeds round the ponds.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorVerdaPondMud]
    decals: [LuaMFloraAuroraFloraBushKonyangReeds]
    threshold: 0.4
    noise: { seed: 228, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorVerdaPondMud]
    decals: [LuaMFloraAuroraAssunzioneGrassAlt, LuaMFloraAuroraFloraBushKonyangReeds]
    threshold: 0.4
    noise: { seed: 229, noiseType: OpenSimplex2, frequency: 3 }
  # Pond rings: reeds to cut, a lotus to eat, shore sage to heal with (Planets/Life/verda.yml).
  # Ponds a few tiles across, between the lakes.
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetGrass, FloorPlanetDirt, WGFloorVerdaMeadowGrass, WGFloorVerdaForestGrass, WGFloorVerdaPondMud]
    entities: [CEWater] # LuaM: CE water on every world
    threshold: 0.85
    noise: { seed: 41, noiseType: OpenSimplex2, frequency: 0.03, fractalType: FBm, octaves: 2 }

