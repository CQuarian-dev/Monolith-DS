# Aerumna: a dark 3 g world that went wrong, and the xenonids' homeworld. Chromite flats and shrouded clay under rain, a
# fungal forest, boulders the gravity left where they fell, crystal spires, a few overgrown ruins and the hive. The pools,
# ore, fauna and the shadow grove stay in WGShadowClearings (open_biomes.yml), which pulls these regions in.
# The Decor Import tiles have no weather, so every tile placed outdoors is a weather child.

- type: tile
  id: WGFloorAerumnaShroud
  edgeSpritePriority: 0 # LuaM: soft borders between planet ground tiles
  edgeSprites: # LuaM
    SouthEast: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nebula_floor_shrouded_SouthEast.png
    NorthEast: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nebula_floor_shrouded_NorthEast.png
    NorthWest: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nebula_floor_shrouded_NorthWest.png
    SouthWest: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nebula_floor_shrouded_SouthWest.png
    South: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nebula_floor_shrouded_South.png
    East: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nebula_floor_shrouded_East.png
    North: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nebula_floor_shrouded_North.png
    West: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nebula_floor_shrouded_West.png
  parent: NebulaFloorShrouded
  weather: true

- type: tile
  id: WGFloorAerumnaClay
  edgeSpritePriority: 0 # LuaM: soft borders between planet ground tiles
  edgeSprites: # LuaM
    SouthEast: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nebula_floor_clay_SouthEast.png
    NorthEast: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nebula_floor_clay_NorthEast.png
    NorthWest: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nebula_floor_clay_NorthWest.png
    SouthWest: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nebula_floor_clay_SouthWest.png
    South: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nebula_floor_clay_South.png
    East: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nebula_floor_clay_East.png
    North: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nebula_floor_clay_North.png
    West: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nebula_floor_clay_West.png
  parent: NebulaFloorClay
  weather: true

- type: tile
  id: WGFloorAerumnaClayRock
  edgeSpritePriority: -2 # LuaM: soft borders between planet ground tiles
  parent: ChompFloorOutdoorsLavalandAshrock
  weather: true

# Grey ground between the dark chromite and the pale clay, round every clay flat, crystal bed and the hive.
- type: tile
  id: WGFloorAerumnaDusk
  edgeSpritePriority: -2 # LuaM: soft borders between planet ground tiles
  parent: FloorCave
  weather: true

- type: tile
  id: WGFloorAerumnaCrystalBed
  edgeSpritePriority: -2 # LuaM: soft borders between planet ground tiles
  parent: AuroraFloorExoplanetCrystal
  weather: true

# A region of giant mushrooms on shrouded ground; the fungus decal pales the floor between them.
- type: biomeTemplate
  id: WGAerumnaFungalForest
  layers:
  - !type:BiomeDecalLayer
    allowedTiles: [WGFloorAerumnaShroud]
    decals: [AuroraDecalFloorDecalFungus]
    threshold: 0.45
    divisions: 1
    noise: { seed: 72, noiseType: OpenSimplex2, frequency: 0.5 }
  - !type:BiomeTileLayer
    tile: WGFloorAerumnaShroud
    threshold: -1
  # Glowing slugs and shadow cats; only here, never in the open.
  # Small shrooms carpet the floor.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorAerumnaShroud]
    decals:
    - LuaMFloraGoonMushrooms
    - LuaMFloraGoonMushroomsType1
    - LuaMFloraGoonMushroomsType2
    - LuaMFloraGoonMushroomsType3
    - LuaMFloraGoonMushroomsType4
    - LuaMFloraGoonMushroomsType5
    - LuaMFloraGoonMushroomsType6
    - LuaMFloraNovaFloraMushroom
    - LuaMFloraNovaFloraMushroomBlue
    - LuaMFloraNovaFloraMushroomGreen
    threshold: 0.45
    noise: { seed: 73, noiseType: OpenSimplex2, frequency: 4 }
  # Taller caps between them.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorAerumnaShroud]
    decals: [LuaMFloraNovaTallShroomColoredBlue, LuaMFloraNovaTallShroomColoredGreen, LuaMFloraNovaCapShroomColoredBlue, LuaMFloraNovaCapShroomColoredGreen]
    threshold: 0.7
    noise: { seed: 74, noiseType: OpenSimplex2, frequency: 3 }
  # Bioluminescent plants, glowshrooms and lightshrooms light the dark.
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorAerumnaShroud]
    entities: [NovaFloraBiolumi, NovaFloraBiolumiFlower, NovaFloraBiolumiLamp, NovaFloraBiolumiMine]
    threshold: 0.82
    noise: { seed: 75, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorAerumnaShroud]
    entities: [ShiptestFluffGlowshroom, NovaFloraAshLightshroom, NovaAshLightshroomBlue, NovaAshLightshroomGreen]
    threshold: 0.78
    noise: { seed: 76, noiseType: OpenSimplex2, frequency: 3 }
  # Giant mushroom trees.
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorAerumnaShroud]
    entities:
    - NovaTreeMushroomReverse
    - NovaMushroomBlueReverse
    - NovaMushroomGreenReverse
    - AuroraFloraTreeMushroom
    - NovaStumpMushroomReverse
    threshold: 0.74
    noise: { seed: 77, noiseType: OpenSimplex2, frequency: 1.5 }
  # Plants that do something: caps to pick and carry as lights, sap pods to drink, and the odd spore pod that blinds.
  # The forest's core, where the mind-fog mushrooms grow. Its noise is the forest's own, at a higher threshold.


# Boulders the gravity brought down, thick in a field and thin elsewhere.
- type: biomeTemplate
  id: WGAerumnaBoulderField
  layers:
  # Gravity crabs; listed first so a boulder wins a shared tile.
  - !type:BiomeEntityLayer
    allowedTiles: [FloorChromite, WGFloorAerumnaClay, WGFloorAerumnaClayRock, WGFloorAerumnaDusk]
    entities:
    - CoyoteFloraChompBoulder
    - CoyoteFloraChompLargeBoulder
    - CoyoteFloraChompTallBoulder
    - DarkPackFloraRockDarkpack
    - DarkPackFloraRockDarkpackBig
    - GoonStone2
    - GoonStone3
    - GoonStone4
    - GoonStone5
    - GoonStone6
    - GoonStone7
    - GoonStone8
    threshold: 0.8
    noise: { seed: 90, noiseType: OpenSimplex2, frequency: 2.5 }

# Crystal spires on a pale bed, with the planet's pink crystal standing among them.
- type: biomeTemplate
  id: WGAerumnaCrystalSpires
  layers:
  - !type:BiomeTileLayer
    tile: WGFloorAerumnaCrystalBed
    threshold: -1
  # The light that lives in the spires.
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorAerumnaCrystalBed]
    entities:
    - ShiptestFloraRockCrystal
    - VorePropRockCrystal
    - VorePropRockCrystalDust
    - AuroraFloraRockSpire
    - CrystalPink
    threshold: 0.72
    noise: { seed: 84, noiseType: OpenSimplex2, frequency: 2 }

# A small overgrown ruin: a few root walls in a tangle of luce-vine.
- type: biomeTemplate
  id: WGAerumnaRuinPocket
  layers:
  - !type:BiomeEntityLayer
    allowedTiles: [FloorChromite, WGFloorAerumnaClay, WGFloorAerumnaClayRock, WGFloorAerumnaDusk, WGFloorAerumnaShroud]
    entities: [AuroraAssunzioneBushLucevine]
    threshold: 0.45
    noise: { seed: 98, noiseType: OpenSimplex2, frequency: 2.5 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorChromite, WGFloorAerumnaClay, WGFloorAerumnaClayRock, WGFloorAerumnaDusk, WGFloorAerumnaShroud]
    entities: [GoonSetpiecesRootwall]
    threshold: 0.86
    noise: { seed: 99, noiseType: OpenSimplex2, frequency: 3 }
  # A few of the vines are alive: they tend xenonids and lash everyone else.

# The xenonid homeworld's hive: dark crust under wild weeds, with small resin chambers, resin doors and eggs in them.
# A minority region (WGShadowClearings pulls it in last, so its ground wins where it overlaps the others). Everything it
# lays stands on the hive ground only; the weeds never spread (WGXenoWeedsWild) and the eggs lie dormant until walked up to.
- type: tile
  id: WGFloorAerumnaHive
  edgeSpritePriority: -2 # LuaM: soft borders between planet ground tiles
  parent: ChompFloorOutdoorsRocksCetus
  weather: true

- type: biomeTemplate
  id: WGAerumnaHive
  layers:
  - !type:BiomeTileLayer
    tile: WGFloorAerumnaHive
    threshold: -1
  # Wild weeds over most of the ground, thinning out in patches.
  # More of the hive's drones and runners than anywhere else on the planet.
  # Small chambers: a ring of resin with gaps and doors round a floor of weeds and eggs.

# Every tile of a chamber blob is resin, except where a gap or a door is cut through it and where the blob's heart is a
# floor. The heart's noise is the blob's own, at a higher threshold.

  # Egg clusters, one to three eggs together.
