# Clotted blood; the surface no longer uses it (its rivers are lakes now), but the Gut's clot floor is built on it.
- type: tile
  id: WGFloorFleshRiverBank
  parent: NovaFloorMeatFresh
  sprite: /Textures/_WG/Planets/BoneField/clotted_blood.png
  variants: 5
  placementVariants: [1, 1, 1, 1, 1]
  weather: true

# Dead growth gets flesh names so the planet map doesn't paint the grove edges as vegetation.
- type: entity
  id: WGFleshSnagMahogany
  parent: NebulaTreeDeadMahogany
  name: withered limb
  description: A dead trunk, stripped and stiff. Whatever grew it has moved on.

- type: entity
  id: WGFleshSnagYew
  parent: NebulaTreeDeadYew
  name: withered limb
  description: A dead trunk, stripped and stiff. Whatever grew it has moved on.

- type: entity
  id: WGFleshSnagWalnut
  parent: NebulaTreeDeadWalnut
  name: withered limb
  description: A dead trunk, stripped and stiff. Whatever grew it has moved on.

- type: entity
  id: WGFleshSnagBarren
  parent: ShiptestTreeDeadBarren
  name: withered limb
  description: A dead trunk, stripped and stiff. Whatever grew it has moved on.

- type: entity
  id: WGFleshSnagBurnedOne
  parent: CoyoteFloraBurnedtree1
  name: withered limb
  description: A dead trunk, stripped and stiff. Whatever grew it has moved on.

- type: entity
  id: WGFleshSnagBurnedThree
  parent: CoyoteFloraBurnedtree3
  name: withered limb
  description: A dead trunk, stripped and stiff. Whatever grew it has moved on.

# Outside every grove: a band of dried crust with dead trees and shrubs. Shares the grove's noise, lower threshold.
- type: biomeTemplate
  id: WGCarcinomaScabEdge
  layers:
  - !type:BiomeTileLayer
    tile: WGFloorFleshCrust
    threshold: -1
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorFleshCrust]
    decals: [LuaMFloraGoonShrubDead, LuaMFloraGoonShrubDead2, LuaMFloraGoonShrubDead3, LuaMFloraGoonShrubDead4]
    threshold: 0.84
    noise: { seed: 91, noiseType: OpenSimplex2, frequency: 1.5 }
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorFleshCrust]
    entities: [WGFleshSnagMahogany, WGFleshSnagYew, WGFleshSnagWalnut, WGFleshSnagBarren, WGFleshSnagBurnedOne, WGFleshSnagBurnedThree]
    threshold: 0.86
    noise: { seed: 92, noiseType: OpenSimplex2, frequency: 1 }

# Rib arches, skulls and bone rock on bone-flecked flesh.
- type: biomeTemplate
  id: WGCarcinomaBoneField
  layers:
  - !type:BiomeTileLayer
    tile: WGFloorFleshBoneMeaty
    threshold: -1
  - !type:BiomeTileLayer
    tile: WGFloorFleshBoneSpine
    threshold: 0.45
    noise: { seed: 94, noiseType: OpenSimplex2, frequency: 0.05 }
  - !type:BiomeTileLayer
    tile: WGFloorFleshBoneStraight
    threshold: 0.55
    noise: { seed: 95, noiseType: OpenSimplex2, frequency: 0.05 }
  # Pullable bone piles and the field's burrowers (_WG/Planets/Life); the scenery layers below win where they overlap.
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorFleshBoneMeaty, WGFloorFleshBoneSpine, WGFloorFleshBoneStraight]
    entities: [WGCarcinomaBoneLumpOne, WGCarcinomaBoneLumpTwo, WGCarcinomaBoneLumpThree]
    threshold: 0.94
    noise: { seed: 97, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorFleshBoneMeaty, WGFloorFleshBoneSpine, WGFloorFleshBoneStraight]
    entities: [WGCarcinomaBoneHorn, WGCarcinomaBoneHornTurned, WGCarcinomaBoneSkull, WGCarcinomaBoneSkullHalf, WGCarcinomaBoneSkullHalfTurned]
    threshold: 0.92
    noise: { seed: 98, noiseType: OpenSimplex2, frequency: 1 }

# A few tiles of resin and hive wall inside the tendon forest.
- type: biomeTemplate
  id: WGCarcinomaHivePocket
  layers:
  - !type:BiomeTileLayer
    tile: WGFloorFlesh
    threshold: -1
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorFlesh, FloorFlesh]
    entities: [GoonSetpiecesHive, ChompResin, PolarisResin]
    threshold: -0.2
    noise: { seed: 99, noiseType: OpenSimplex2, frequency: 0.5 }

# Wet dark ground, dense with blood pools that have polyps and pustules round them.
- type: biomeTemplate
  id: WGCarcinomaMarsh
  layers:
  - !type:BiomeTileLayer
    tile: WGFloorFleshMarshMud
    threshold: -1
  - !type:BiomeTileLayer
    tile: WGFloorFleshMarshDirt
    threshold: 0.4
    noise: { seed: 101, noiseType: OpenSimplex2, frequency: 0.04 }
  - !type:BiomeMetaLayer
    template: WGCarcinomaMarshRim
    threshold: 0.3
    noise: { seed: 103, noiseType: OpenSimplex2, frequency: 0.06, fractalType: FBm, octaves: 2 }
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorFleshMarshMud, WGFloorFleshMarshDirt]
    entities: [WGBloodOcean]
    threshold: 0.4
    noise: { seed: 103, noiseType: OpenSimplex2, frequency: 0.06, fractalType: FBm, octaves: 2 }

# The ring just outside a marsh pool. Same noise as the pool, lower threshold.
- type: biomeTemplate
  id: WGCarcinomaMarshRim
  layers:
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorFleshMarshMud, WGFloorFleshMarshDirt]
    entities: [WGFleshPolyp]
    threshold: 0.7
    noise: { seed: 104, noiseType: OpenSimplex2, frequency: 0.8 }

# Scabbed shore between the lake and the ground, with a few clots of blood wall.
- type: biomeTemplate
  id: WGCarcinomaScabShore
  layers:
  # Plain flesh at the outer edge, scab flecked in over it, then solid by the water (the lake's own noise), so the
  # band frays into the ground instead of ending on a straight line of tiles.
  - !type:BiomeTileLayer
    tile: WGFloorFlesh
    threshold: -1
  - !type:BiomeTileLayer
    tile: WGFloorFleshScab
    threshold: 0.3
    noise: { seed: 107, noiseType: OpenSimplex2, frequency: 0.45 }
  - !type:BiomeTileLayer
    tile: WGFloorFleshScab
    threshold: 0.66
    noise: { seed: 61, frequency: 0.012, noiseType: OpenSimplex2, fractalType: FBm, octaves: 2, lacunarity: 2 }
  - !type:BiomeTileLayer
    tile: WGFloorFleshBoneMeaty
    threshold: 0.6
    noise: { seed: 107, noiseType: OpenSimplex2, frequency: 0.08 }
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorFleshScab, WGFloorFleshBoneMeaty]
    entities: [TauCetiMeatlandWall]
    threshold: 0.93
    noise: { seed: 108, noiseType: OpenSimplex2, frequency: 0.5 }

