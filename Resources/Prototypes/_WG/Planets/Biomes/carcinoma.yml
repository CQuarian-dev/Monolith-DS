# Carcinoma's surface regions built from the Decor Import assets: scab shores, bone fields, hive pockets, meat marsh
# and dead crust at the grove edges. Every outdoor tile is a weather child; every id says "flesh" so the planet map
# keeps colouring the ground as flesh. The art is recoloured to the flesh palette (_WG/Planets/BoneField).

# Scab crust where a blood lake meets the shore.
- type: tile
  id: WGFloorFleshScab
  parent: NovaFloorMeatFresh
  sprite: /Textures/_WG/Planets/BoneField/scab_shore.png
  edgeSpritePriority: -2 # LuaM: soft borders between planet ground tiles
  variants: 4
  placementVariants: [1, 1, 1, 1]
  weather: true

# The bone field's ground: calcified flesh at the base, bleached bone plates and cartilage patches on top. The ids keep
# their old Meaty/Spine/Straight names, which the planet's layers and tests already use.
- type: tile
  id: WGFloorFleshBoneMeaty
  parent: NovaFloorBoneMeaty
  sprite: /Textures/_WG/Planets/BoneField/calcified_flesh.png
  edgeSpritePriority: -2 # LuaM: soft borders between planet ground tiles
  variants: 4
  placementVariants: [1, 1, 1, 1]
  weather: true

- type: tile
  id: WGFloorFleshBoneSpine
  parent: NovaFloorBoneSpine
  sprite: /Textures/_WG/Planets/BoneField/bleached_bone.png
  edgeSpritePriority: -2 # LuaM: soft borders between planet ground tiles
  variants: 4
  placementVariants: [1, 1, 1, 1]
  weather: true

- type: tile
  id: WGFloorFleshBoneStraight
  parent: NovaFloorBoneStraight
  sprite: /Textures/_WG/Planets/BoneField/cartilage.png
  edgeSpritePriority: -2 # LuaM: soft borders between planet ground tiles
  variants: 4
  placementVariants: [1, 1, 1, 1]
  weather: true

