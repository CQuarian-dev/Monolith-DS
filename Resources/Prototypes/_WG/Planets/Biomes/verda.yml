    allowedTiles: [WGFloorVerdaScarDirt, WGFloorVerdaScarWiltedGrass, WGFloorVerdaScarAshDirt, WGFloorVerdaScarDirtPatch]
    entities: [MonoPlanetmapOreBase]
    threshold: 0.72
    noise: { seed: 11, noiseType: OpenSimplex2, frequency: 0.02 }
  # Dead shrubs and the wasteland's own plants, stones, a few bones, dead and burnt trees.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorVerdaScarDirt, WGFloorVerdaScarWiltedGrass, WGFloorVerdaScarAshDirt, WGFloorVerdaScarDirtPatch]
