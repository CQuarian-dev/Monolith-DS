# A conifer stand inside the woodland: pines and ferns, over the same dark grass.
- type: biomeTemplate
  id: WGVerdaPineGrove
  layers:
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [FloorPlanetGrass, WGFloorVerdaForestGrass]
    decals: [LuaMFloraAuroraAssunzioneBushFerny]
    threshold: 0.75
    noise: { seed: 217, noiseType: OpenSimplex2, frequency: 4 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetGrass, WGFloorVerdaForestGrass]
    entities: [CoyoteFloraTreeMedPine, DarkPackTreeVampPine]
    threshold: 0.58
    noise: { seed: 218, noiseType: OpenSimplex2, frequency: 2 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetGrass, WGFloorVerdaForestGrass]
    entities: [CoyoteFloraTreeCypressTree, DarkPackTreeVampPine]
    threshold: 0.8
    noise: { seed: 219, noiseType: OpenSimplex2, frequency: 2 }

# Lake shores, laid over the plains where the lake's own noise (biomes.yml) runs just under the water's threshold.
# The tile layers repeat that noise, so each ring follows the water: marsh, mud, wet sand.
- type: biomeTemplate
  id: WGVerdaShore
  layers:
  - !type:BiomeTileLayer
    tile: WGFloorVerdaMarshGrass
    threshold: -1
  - !type:BiomeTileLayer
    tile: WGFloorVerdaMarshMud
    threshold: 0.68
    noise: { seed: 71, noiseType: OpenSimplex2, frequency: 0.012, fractalType: FBm, octaves: 2, lacunarity: 2 }
  - !type:BiomeTileLayer
    tile: WGFloorVerdaShoreSand
    threshold: 0.73
    noise: { seed: 71, noiseType: OpenSimplex2, frequency: 0.012, fractalType: FBm, octaves: 2, lacunarity: 2 }
  # Frogs and crabs (Planets/Life/verda_mobs.yml).
  # Marsh: tall grass and the odd bush and drowned tree.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorVerdaMarshGrass]
    decals: [LuaMFloraGoonShrub, LuaMFloraAuroraFloraBushGrove]
    threshold: 0.85
    noise: { seed: 222, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorVerdaMarshGrass]
    entities: [CoyoteFloraTreeCypressTree, NebulaTreeDeadYew]
    threshold: 0.9
    noise: { seed: 223, noiseType: OpenSimplex2, frequency: 2 }
  # Reeds and lilies at the waterline.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorVerdaMarshMud, WGFloorVerdaShoreSand]
    decals: [LuaMFloraAuroraFloraBushKonyangReeds]
    threshold: 0.5
    noise: { seed: 224, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorVerdaMarshMud, WGFloorVerdaShoreSand]
    decals: [LuaMFloraAuroraAssunzioneGrassAlt, LuaMFloraAuroraFloraBushKonyangReeds]
    threshold: 0.68
    noise: { seed: 225, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorVerdaMarshMud]
    decals: [LuaMFloraVoreFloraLily1, LuaMFloraVoreFloraLily2]
    threshold: 0.7
    noise: { seed: 226, noiseType: OpenSimplex2, frequency: 4 }
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorVerdaMarshMud]
    decals: [LuaMFloraVoreFloraLily3, LuaMFloraGoonFakeobjectLotus]
    threshold: 0.8
    noise: { seed: 227, noiseType: OpenSimplex2, frequency: 4 }
  # Reeds to cut, a lotus to eat, shore sage to heal with (Planets/Life/verda.yml).

# An irradiated scar: dead ground, dead trees and scrub, a few bones.
- type: biomeTemplate
  id: WGVerdaScar
  layers:
  - !type:BiomeTileLayer
    tile: WGFloorVerdaScarDirt
    threshold: -1
  - !type:BiomeTileLayer
    tile: WGFloorVerdaScarWiltedGrass
    threshold: 0.25
    noise: { seed: 84, noiseType: OpenSimplex2, frequency: 0.02 }
  - !type:BiomeTileLayer
    tile: WGFloorVerdaScarAshDirt
    threshold: 0.45
    noise: { seed: 86, noiseType: OpenSimplex2, frequency: 0.015 }
  - !type:BiomeTileLayer
    tile: WGFloorVerdaScarDirtPatch
    threshold: 0.55
    noise: { seed: 85, noiseType: OpenSimplex2, frequency: 0.04 }
  # Mutants and vermin (Planets/Life/verda_mobs.yml).
