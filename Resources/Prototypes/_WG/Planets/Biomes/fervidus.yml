# Fervidus: hot basalt, lava channels and ash. The ground is drawn from imported lavaland and Baystation tiles.
# The imported tiles are indoor floors with no weather, so each one used outdoors gets a weather child here.
# Natural ground: unbreakable. Names steer the orbit map: ash and tar read as rock, ash dirt as dry ground (WGPlanetMapSystem).
# Every kind of flora has a layer of its own: a layer picks from its list by a noise value that bunches, so a list shows one or two kinds.

# Ash flats.
- type: tile
  parent: ChompFloorOutdoorsLavalandAsh
  id: WGFloorFervidusAshDust
  edgeSpritePriority: 0 # LuaM: soft borders between planet ground tiles
  edgeSprites: # LuaM
    SouthEast: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_chomp_lavaland_ash_SouthEast.png
    NorthEast: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_chomp_lavaland_ash_NorthEast.png
    NorthWest: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_chomp_lavaland_ash_NorthWest.png
    SouthWest: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_chomp_lavaland_ash_SouthWest.png
    South: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_chomp_lavaland_ash_South.png
    East: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_chomp_lavaland_ash_East.png
    North: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_chomp_lavaland_ash_North.png
    West: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_chomp_lavaland_ash_West.png
  isSubfloor: true
  deconstructTools: []
  indestructible: true
  weather: true

# Cooled crust: gray rock round the lava channels and in the ashfields.
- type: tile
  parent: ChompFloorOutdoorsLavalandAshrock
  id: WGFloorFervidusAshRock
  edgeSpritePriority: -2 # LuaM: soft borders between planet ground tiles
  isSubfloor: true
  deconstructTools: []
  indestructible: true
  weather: true

# Ash-choked scrub ground.
- type: tile
  parent: NovaFloorGrassLavaland
  id: WGFloorFervidusAshDirt
  edgeSpritePriority: 0 # LuaM: soft borders between planet ground tiles
  edgeSprites: # LuaM
    SouthEast: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nova_grass_lavaland_SouthEast.png
    NorthEast: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nova_grass_lavaland_NorthEast.png
    NorthWest: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nova_grass_lavaland_NorthWest.png
    SouthWest: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nova_grass_lavaland_SouthWest.png
    South: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nova_grass_lavaland_South.png
    East: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nova_grass_lavaland_East.png
    North: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nova_grass_lavaland_North.png
    West: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_nova_grass_lavaland_West.png
  isSubfloor: true
  deconstructTools: []
  indestructible: true
  weather: true

# Small pools of tar. Cosmetic: they are tiles, so roads and POIs still count them as dry ground.
- type: tile
  parent: BayFloorWaterShallowTar
  id: WGFloorFervidusTarPool
  edgeSpritePriority: -1 # LuaM: soft borders between planet ground tiles
  isSubfloor: true
  deconstructTools: []
  indestructible: true
  weather: true

# Small pale pools of sulfur.
- type: tile
  parent: BayFloorWaterShallowChlorineLiquid
  id: WGFloorFervidusSulfurPool
  edgeSpritePriority: -1 # LuaM: soft borders between planet ground tiles
  isSubfloor: true
  deconstructTools: []
  indestructible: true
  weather: true

# Where the ashfields lie; tiles and flora both. Tar and sulfur pools are kept to ash ground.
- type: biomeTemplate
  id: WGFervidusAshFields
  layers:
  # Cooled rock at the field's edge, fine dust inside it (the field's own noise, a little higher), then bare ash dirt.
  - !type:BiomeTileLayer
    tile: WGFloorFervidusAshRock
    threshold: -1
  - !type:BiomeTileLayer
    tile: WGFloorFervidusAshDust
    threshold: 0.3
    noise: { seed: 51, noiseType: OpenSimplex2, frequency: 0.007, fractalType: FBm, octaves: 2 }
  - !type:BiomeTileLayer
    tile: WGFloorFervidusAshDirt
    threshold: 0.42
    noise: { seed: 53, noiseType: OpenSimplex2, frequency: 0.012 }
  - !type:BiomeTileLayer
    tile: WGFloorFervidusTarPool
    threshold: 0.95
    noise: { seed: 54, noiseType: OpenSimplex2, frequency: 0.05 }
  - !type:BiomeTileLayer
    tile: WGFloorFervidusSulfurPool
    threshold: 0.96
    noise: { seed: 55, noiseType: OpenSimplex2, frequency: 0.05 }
  # Ashfield wildlife: laser raptors and ash golems.
  # Ash grass in stands on the scrub.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorFervidusAshDirt]
    decals: [LuaMFloraShiptestFloraGrassBrown]
    threshold: 0.3
    noise: { seed: 101, noiseType: OpenSimplex2, frequency: 3 }
  # Ash grass in stands on the scrub.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorFervidusAshDirt]
    decals: [LuaMFloraCMGrassTallgrassDesert]
    threshold: 0.38
    noise: { seed: 102, noiseType: OpenSimplex2, frequency: 3 }
  # Dead scrub.
  # Dead scrub.
  # Dead scrub.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorFervidusAshDust, WGFloorFervidusAshDirt]
    decals: [LuaMFloraGoonShrubDead]
    threshold: 0.96
    noise: { seed: 105, noiseType: OpenSimplex2, frequency: 3 }
  # Ash cacti.
  # Ash shrooms.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorFervidusAshDust, WGFloorFervidusAshDirt, WGFloorFervidusAshRock]
    decals: [LuaMFloraNovaAshCapShroomColored]
    threshold: 0.96
    noise: { seed: 107, noiseType: OpenSimplex2, frequency: 3 }
  # Ash shrooms.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorFervidusAshDust, WGFloorFervidusAshDirt, WGFloorFervidusAshRock]
    decals: [LuaMFloraNovaAshLeafShroomColored]
    threshold: 0.96
    noise: { seed: 108, noiseType: OpenSimplex2, frequency: 3 }
  # Ash shrooms.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorFervidusAshDust, WGFloorFervidusAshDirt, WGFloorFervidusAshRock]
    decals: [LuaMFloraNovaAshTallShroomColored]
    threshold: 0.96
    noise: { seed: 109, noiseType: OpenSimplex2, frequency: 3 }
  # Ash shrooms.
  # Ash shrooms.
  # Ash flowers.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorFervidusAshDust, WGFloorFervidusAshDirt]
    decals: [LuaMFloraTgFloraAshPlasmaFlower]
    threshold: 0.95
    noise: { seed: 112, noiseType: OpenSimplex2, frequency: 4 }
  # Ash flowers.
  # Ash flowers.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles: [WGFloorFervidusAshDust, WGFloorFervidusAshDirt]
    decals: [LuaMFloraTgFloraAshPodsneyzka]
    threshold: 0.95
    noise: { seed: 114, noiseType: OpenSimplex2, frequency: 4 }
  # Ash flowers.
  # Burnt trees, solid and rare.
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorFervidusAshDust, WGFloorFervidusAshDirt]
    entities: [CoyoteFloraBurnedtree1]
    threshold: 0.985
    noise: { seed: 116, noiseType: OpenSimplex2, frequency: 2 }
  # Burnt trees, solid and rare.
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorFervidusAshDust, WGFloorFervidusAshDirt]
    entities: [CoyoteFloraBurnedtree2]
    threshold: 0.985
    noise: { seed: 117, noiseType: OpenSimplex2, frequency: 2 }
  # Burnt trees, solid and rare.
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorFervidusAshDust, WGFloorFervidusAshDirt]
    entities: [CoyoteFloraBurnedtree3]
    threshold: 0.985
    noise: { seed: 118, noiseType: OpenSimplex2, frequency: 2 }
  # Burnt trees, solid and rare.
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorFervidusAshDust, WGFloorFervidusAshDirt]
    entities: [CoyoteFloraBurnedtree5]
    threshold: 0.985
    noise: { seed: 119, noiseType: OpenSimplex2, frequency: 2 }
  # Rarest of all, a lit dead tree.
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorFervidusAshDust, WGFloorFervidusAshDirt]
    entities: [ShiptestTreeDeadHell]
    threshold: 0.99
    noise: { seed: 120, noiseType: OpenSimplex2, frequency: 2 }

# The crust of cooled rock round the lava channels (laid by WGOpenBasalt on the same noise as the crust tiles):
# cinder slimes and the rare hellspawn, and ember flowers.
  # Spitting flowers.
