# Thrascias: snowfields, tundra, pack ice and frozen lakes, boreal pine pockets, crystal fields round the plasma pools.
# Every imported tile gets a weather child, so snow falls on it (the imported tiles are not weather tiles).
# Tile ids carry "snow"/"ice"/"dirt" so the orbit map colours them right (WGPlanetMapSystem.TileGround).
# A layer that lists several entities picks from a second noise, and at a whole-number frequency that pick never varies,
# so such layers run at 0.7 or 2.5 and the common entries sit in the middle of the list.

# Snow and tundra.
- type: tile
  id: WGFloorThrasciasSnowRough
  edgeSpritePriority: 0 # LuaM: soft borders between planet ground tiles
  edgeSprites: # LuaM
    SouthEast: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_goonstation_floor_snowrough_SouthEast.png
    NorthEast: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_goonstation_floor_snowrough_NorthEast.png
    NorthWest: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_goonstation_floor_snowrough_NorthWest.png
    SouthWest: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_goonstation_floor_snowrough_SouthWest.png
    South: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_goonstation_floor_snowrough_South.png
    East: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_goonstation_floor_snowrough_East.png
    North: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_goonstation_floor_snowrough_North.png
    West: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_goonstation_floor_snowrough_West.png
  parent: GoonFloorSnowrough
  weather: true
  indestructible: true
  isSubfloor: true

- type: tile
  id: WGFloorThrasciasSnowCalm
  edgeSpritePriority: 0 # LuaM: soft borders between planet ground tiles
  edgeSprites: # LuaM
    SouthEast: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_goonstation_floor_snowcalm_SouthEast.png
    NorthEast: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_goonstation_floor_snowcalm_NorthEast.png
    NorthWest: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_goonstation_floor_snowcalm_NorthWest.png
    SouthWest: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_goonstation_floor_snowcalm_SouthWest.png
    South: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_goonstation_floor_snowcalm_South.png
    East: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_goonstation_floor_snowcalm_East.png
    North: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_goonstation_floor_snowcalm_North.png
    West: /Textures/_LuaM/Tiles/Edges/_WG_DecorImport_Tiles_goonstation_floor_snowcalm_West.png
  parent: GoonFloorSnowcalm
  weather: true
  indestructible: true
  isSubfloor: true

# Bare frozen soil; the only brown ground on the planet.
- type: tile
  id: WGFloorThrasciasFrozenDirt
  edgeSpritePriority: 0 # LuaM: soft borders between planet ground tiles
  edgeSprites: # LuaM
    SouthEast: /Textures/_LuaM/Tiles/Edges/Tiles_Asteroid_asteroid_SouthEast.png
    NorthEast: /Textures/_LuaM/Tiles/Edges/Tiles_Asteroid_asteroid_NorthEast.png
    NorthWest: /Textures/_LuaM/Tiles/Edges/Tiles_Asteroid_asteroid_NorthWest.png
    SouthWest: /Textures/_LuaM/Tiles/Edges/Tiles_Asteroid_asteroid_SouthWest.png
    South: /Textures/_LuaM/Tiles/Edges/Tiles_Asteroid_asteroid_South.png
    East: /Textures/_LuaM/Tiles/Edges/Tiles_Asteroid_asteroid_East.png
    North: /Textures/_LuaM/Tiles/Edges/Tiles_Asteroid_asteroid_North.png
    West: /Textures/_LuaM/Tiles/Edges/Tiles_Asteroid_asteroid_West.png
  parent: FloorAsteroidSand
  weather: true
  indestructible: true
  isSubfloor: true

# Dug snow rings the frozen dirt, so the brown ground fades into white instead of meeting it.
- type: tile
  id: WGFloorThrasciasSnowDug
  parent: FloorSnowDug
  weather: true
  indestructible: true
  isSubfloor: true

# Pack ice and frozen lakes. Cracked ice grips; the smooth and lake ice is as slippery as the old FloorIce.
# The clear, lake and smooth ice are FloorIce, whose sprite is slightly see-through, so the layer below shows through.
- type: tile
  id: WGFloorThrasciasPackIce
  parent: RMCPlanetIce0
  weather: true

- type: tile
  id: WGFloorThrasciasRoughIce
  edgeSpritePriority: -2 # LuaM: soft borders between planet ground tiles
  parent: GoonFloorWaterIceRough
  weather: true
  indestructible: true
  isSubfloor: true

# Clear ice that grips, where the dark ice did.
- type: tile
  id: WGFloorThrasciasClearIce
  edgeSpritePriority: -1 # LuaM: soft borders between planet ground tiles
  parent: FloorIce
  weather: true
  indestructible: true
  isSubfloor: true
  friction: 1
  mobAcceleration: 1

- type: tile
  id: WGFloorThrasciasClearIceSmooth
  edgeSpritePriority: -1 # LuaM: soft borders between planet ground tiles
  parent: FloorIce
  weather: true
  indestructible: true
  isSubfloor: true
  friction: 0.05
  mobAcceleration: 0.1

# The bed of a lake (WGThrasciasLakeWater): grippy, as the water over it gives the slide while frozen.
- type: tile
  id: WGFloorThrasciasLakeIce
  edgeSpritePriority: -1 # LuaM: soft borders between planet ground tiles
  parent: FloorIce
  weather: true
  indestructible: true
  isSubfloor: true
  friction: 1
  mobAcceleration: 1

# A lake of real water that freezes by the air, like every world's. Thrascias air is far below freezing, so it reads
# as ice; its iceFriction and iceAcceleration are the old lake tile's.
- type: entity
  id: WGThrasciasLakeWater
  parent: CEWater # LuaM: CE water on every world
  name: lake water
  components:
  - type: WGFreezableWater
    iceFriction: 0.05
    iceAcceleration: 0.1

# Frozen plasma growth: the ground round every plasma pool.
- type: tile
  id: WGFloorThrasciasCrystalIce
  edgeSpritePriority: -2 # LuaM: soft borders between planet ground tiles
  parent: AuroraFloorExoplanetCrystal
  weather: true
  indestructible: true
  isSubfloor: true

- type: biomeTemplate
  id: WGThrasciasTerrain
  layers:
  - !type:BiomeTileLayer
    tile: FloorSnow
    threshold: -1
  - !type:BiomeTileLayer
    tile: WGFloorThrasciasSnowRough
    threshold: 0.3
    noise: { seed: 61, noiseType: OpenSimplex2, frequency: 0.012 }
  - !type:BiomeTileLayer
    tile: WGFloorThrasciasSnowCalm
    threshold: 0.3
    noise: { seed: 62, noiseType: OpenSimplex2, frequency: 0.012 }
  # Bare frozen soil inside a ring of dug snow: the same noise, a lower threshold.
  - !type:BiomeTileLayer
    tile: WGFloorThrasciasSnowDug
    threshold: 0.72
    noise: { seed: 63, noiseType: OpenSimplex2, frequency: 0.012 }
  - !type:BiomeTileLayer
    tile: WGFloorThrasciasFrozenDirt
    threshold: 0.88
    noise: { seed: 63, noiseType: OpenSimplex2, frequency: 0.012 }
  # Grey snow rings every sheet of ice, so white ground never meets it directly: the ice noise, a lower threshold.
  - !type:BiomeTileLayer
    tile: FloorSnow
    threshold: 0.45
    noise: { seed: 4, noiseType: OpenSimplex2, frequency: 0.01 }
  # Pack ice and frozen lakes, where the old ice patches were.
  - !type:BiomeMetaLayer
    template: WGThrasciasPackIce
    threshold: 0.6
    noise: { seed: 4, noiseType: OpenSimplex2, frequency: 0.01 }
  # Frozen plasma: the same ridged noise as the pools, at a lower threshold, so each pool sits in a crystal field.
  - !type:BiomeTileLayer
    tile: WGFloorThrasciasCrystalIce
    threshold: 0.91
    noise: { seed: 3, noiseType: OpenSimplex2, frequency: 0.004, fractalType: Ridged, octaves: 1 }
  # Decals go first: a decal layer above an entity layer hides the entity.
  - !type:BiomeDecalLayer
    allowedTiles:
    - FloorSnow
    - WGFloorThrasciasSnowRough
    - WGFloorThrasciasSnowCalm
    threshold: 0.8
    divisions: 1
    noise: { seed: 201, noiseType: OpenSimplex2, frequency: 4 }
    decals:
    - AuroraDecalFloorDecalSnowdrift
  - !type:BiomeDecalLayer
    allowedTiles:
    - WGFloorThrasciasFrozenDirt
    - WGFloorThrasciasSnowDug
    - WGFloorThrasciasSnowRough
    threshold: 0.75
    divisions: 1
    noise: { seed: 202, noiseType: OpenSimplex2, frequency: 5 }
    decals:
    - AuroraDecalFloorDecalSnowrocks
  - !type:BiomeDecalLayer
    allowedTiles:
    - WGFloorThrasciasPackIce
    - WGFloorThrasciasRoughIce
    - WGFloorThrasciasClearIce
    threshold: 0.8
    divisions: 1
    noise: { seed: 203, noiseType: OpenSimplex2, frequency: 4 }
    decals:
    - CMDecalRocksIceIce1
  # Tundra growth: tufts of frosted grass poking through the snow.
  - !type:BiomeDecalLayer
    allowedTiles:
    - FloorSnow
    - WGFloorThrasciasSnowRough
    - WGFloorThrasciasFrozenDirt
    - WGFloorThrasciasSnowDug
    threshold: 0.7
    divisions: 1
    noise: { seed: 101, noiseType: OpenSimplex2, frequency: 3 }
    decals:
    - grasssnowa1
    - grasssnowa2
    - grasssnowa3
    - grasssnowb1
    - grasssnowb2
    - grasssnowb3
    - grasssnowc1
    - grasssnowc2
    - grasssnowc3
  # Frozen fungus shows only inside the snowdrifts: the same noise as the drift decals, at a higher threshold.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles:
    - FloorSnow
    - WGFloorThrasciasSnowRough
    - WGFloorThrasciasSnowCalm
    - WGFloorThrasciasFrozenDirt
    - WGFloorThrasciasSnowDug
    decals: [LuaMFloraGoonShrubSnow, LuaMFloraGoonShrubSnow2]
    threshold: 0.85
    noise: { seed: 103, noiseType: OpenSimplex2, frequency: 2.5 }
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorSnow
    - WGFloorThrasciasSnowRough
    - WGFloorThrasciasFrozenDirt
    - WGFloorThrasciasSnowDug
    entities: [GoonStoneSnow, GoonStoneSnow3]
    threshold: 0.93
    noise: { seed: 104, noiseType: OpenSimplex2, frequency: 2.5 }
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorSnow
    - WGFloorThrasciasSnowRough
    - WGFloorThrasciasFrozenDirt
    - WGFloorThrasciasSnowDug
    entities: [GoonStoneSnow2, GoonStoneSnow4]
    threshold: 0.95
    noise: { seed: 106, noiseType: OpenSimplex2, frequency: 2.5 }
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorSnow
    - WGFloorThrasciasSnowRough
    - WGFloorThrasciasFrozenDirt
    - WGFloorThrasciasSnowDug
    entities: [AuroraFloraRockSnow]
    threshold: 0.96
    noise: { seed: 108, noiseType: OpenSimplex2, frequency: 3 }
  # Ice rocks on the pack ice, none on the lake sheets.
  - !type:BiomeEntityLayer
    allowedTiles:
    - WGFloorThrasciasPackIce
    - WGFloorThrasciasRoughIce
    - WGFloorThrasciasClearIce
    entities: [ShiptestFloraRockIcy, AuroraFloraRockIce]
    threshold: 0.8
    noise: { seed: 105, noiseType: OpenSimplex2, frequency: 2.5 }
  - !type:BiomeEntityLayer
    allowedTiles:
    - WGFloorThrasciasPackIce
    - WGFloorThrasciasRoughIce
    - WGFloorThrasciasClearIce
    entities: [ShiptestRockPileIcy]
    threshold: 0.9
    noise: { seed: 109, noiseType: OpenSimplex2, frequency: 3 }
  # Ice crystals to chip, on the pack ice.
  # Boreal pine pockets, a minority of the surface.
  - !type:BiomeMetaLayer
    template: WGThrasciasBorealPocket
    threshold: 0.72
    noise: { seed: 141, noiseType: OpenSimplex2, frequency: 0.012 }
  # Short runs of ice cliff, only on pack ice.
  - !type:BiomeMetaLayer
    template: WGThrasciasIceCliffs
    threshold: 0.3
    noise: { seed: 131, noiseType: OpenSimplex2, frequency: 0.03 }
  # Crystal field growth.
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorThrasciasCrystalIce]
    entities: [ShiptestFloraRockCrystal, VorePropRockCrystal, VorePropRockCrystalDust]
    threshold: 0.55
    noise: { seed: 151, noiseType: OpenSimplex2, frequency: 0.7 }
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorThrasciasCrystalIce]
    entities: [AuroraFloraTreeCrystal]
    threshold: 0.85
    noise: { seed: 152, noiseType: OpenSimplex2, frequency: 2.5 }
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorThrasciasCrystalIce]
    entities: [BayCrystal, ChompQuartz]
    threshold: 0.9
    noise: { seed: 153, noiseType: OpenSimplex2, frequency: 2.5 }
  # Crystal field plants: glowing blooms to pick, and frost pods that burst on whoever comes near.
  # Wildlife by region, on the same noise the one planet-wide spawner used.
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorSnow
    - WGFloorThrasciasSnowRough
    - WGFloorThrasciasSnowCalm
    - WGFloorThrasciasFrozenDirt
    - WGFloorThrasciasSnowDug
    entities: [MonoPlanetmapOreSnow]
    threshold: 0.72
    noise: { seed: 23, noiseType: OpenSimplex2, frequency: 0.012 }
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorSnow
    - WGFloorThrasciasSnowRough
    - WGFloorThrasciasSnowCalm
    - WGFloorThrasciasFrozenDirt
    - WGFloorThrasciasSnowDug
    - WGFloorThrasciasPackIce
    - WGFloorThrasciasRoughIce
    - WGFloorThrasciasClearIce
    - WGFloorThrasciasClearIceSmooth
    - WGFloorThrasciasLakeIce
    - WGFloorThrasciasCrystalIce
    entities: [FloorLiquidPlasmaEntity]
    threshold: 0.95
    noise: { seed: 3, noiseType: OpenSimplex2, frequency: 0.004, fractalType: Ridged, octaves: 1 }

# Cracked pack ice, with rough and clear patches and lakes of water in the middle.
- type: biomeTemplate
  id: WGThrasciasPackIce
  layers:
  - !type:BiomeTileLayer
    tile: WGFloorThrasciasPackIce
    threshold: -1
  - !type:BiomeTileLayer
    tile: WGFloorThrasciasRoughIce
    threshold: 0.55
    noise: { seed: 71, noiseType: OpenSimplex2, frequency: 0.03 }
  - !type:BiomeTileLayer
    tile: WGFloorThrasciasClearIce
    threshold: 0.55
    noise: { seed: 72, noiseType: OpenSimplex2, frequency: 0.03 }
  - !type:BiomeTileLayer
    tile: WGFloorThrasciasClearIceSmooth
    threshold: 0.65
    noise: { seed: 73, noiseType: OpenSimplex2, frequency: 0.04 }
  - !type:BiomeTileLayer
    tile: WGFloorThrasciasLakeIce
    threshold: 0.6
    noise: { seed: 74, noiseType: OpenSimplex2, frequency: 0.02 }
  # The lakes are water over that bed, frozen while the air is.
  - !type:BiomeEntityLayer
    allowedTiles: [WGFloorThrasciasLakeIce]
    entities: [WGThrasciasLakeWater]
    threshold: -1
    noise: { seed: 0, noiseType: OpenSimplex2, frequency: 0.01 }

# Pines on the snow, thick inside the pocket and nowhere outside it.
- type: biomeTemplate
  id: WGThrasciasBorealPocket
  layers:
  # Whipvines and snow spiders sit under the pines and shrubs: a later layer wins a tile.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    allowedTiles:
    - FloorSnow
    - WGFloorThrasciasSnowRough
    - WGFloorThrasciasSnowCalm
    decals: [LuaMFloraGoonShrubSnow, LuaMFloraGoonShrubSnow2]
    threshold: 0.5
    noise: { seed: 143, noiseType: OpenSimplex2, frequency: 0.7 }
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorSnow
    - WGFloorThrasciasSnowRough
    - WGFloorThrasciasSnowCalm
    # A pick lands mostly on the middle entries, so the common pines sit there and the rare ones at the ends.
    entities:
    - DarkPackTreeVampPine
    - VoreFloraTreeSif
    - ShiptestFloraTreePine
    - CoyoteFloraTreeMedPine
    - ShiptestFloraTreePine
    - CoyoteFloraTreeMedPine
    threshold: 0.6
    noise: { seed: 142, noiseType: OpenSimplex2, frequency: 0.7 }

# Cliff lines are the ridges of a noise, cut into short runs by the template's own region noise.
- type: biomeTemplate
  id: WGThrasciasIceCliffs
  layers:
  - !type:BiomeEntityLayer
    allowedTiles:
    - WGFloorThrasciasPackIce
    - WGFloorThrasciasRoughIce
    - WGFloorThrasciasClearIce
    entities: [CMRockIce]
    threshold: 0.9
    noise: { seed: 132, noiseType: OpenSimplex2, frequency: 0.07, fractalType: Ridged, octaves: 1 }
