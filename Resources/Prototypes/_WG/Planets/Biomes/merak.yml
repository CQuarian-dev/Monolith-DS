# Biome: the layers below it win over the ones above it.
- type: biomeTemplate
  id: WGMerakDesert
  layers:
  # Boulders
  - !type:BiomeEntityLayer
    threshold: 0.975
    noise: { seed: 0, noiseType: OpenSimplex2, frequency: 5 }
    allowedTiles: [WGFloorMerakDuneSand, WGFloorMerakGoldSand, WGFloorMerakPaleSand, WGFloorMerakDarkSand]
    entities: [FloraRockSolidPlanet]
  # Dune fauna; each region lays its own wildlife (_WG/Planets/Life/merak.yml).
  # Native plants
  - !type:BiomeEntityLayer
    threshold: 0.915
    noise: { seed: 0, noiseType: OpenSimplex2, frequency: 2 }
    allowedTiles: [WGFloorMerakDuneSand, WGFloorMerakGoldSand, WGFloorMerakPaleSand]
    entities: [FloraPilumaPlant]
  - !type:BiomeEntityLayer
    threshold: 0.925
    noise: { seed: 0, noiseType: OpenSimplex2, frequency: 2 }
    allowedTiles: [WGFloorMerakDuneSand, WGFloorMerakGoldSand]
    entities: [FloraOrakimPlant]
  # Tumbleweeds on open sand and flats
  # Rock decals
  - !type:BiomeDecalLayer
    allowedTiles:
    - WGFloorMerakDuneSand
    - WGFloorMerakGoldSand
    - WGFloorMerakPaleSand
    - WGFloorMerakDarkSand
    threshold: 0.9
    divisions: 1
    noise: { seed: 1, frequency: 5 }
    decals: [Basalt1, Basalt2, Basalt3, Basalt4, Basalt5, Basalt6, Basalt7, Basalt8, Basalt9]
  # Ore crab sites in a band round the outcrops; the outcrops below win where the noise is higher.
  # Ore outcrops
  - !type:BiomeEntityLayer
    allowedTiles:
    - WGFloorMerakDuneSand
    - WGFloorMerakGoldSand
    - WGFloorMerakPaleSand
    - WGFloorMerakDarkSand
    - WGFloorMerakRedDesertSand
    - WGFloorMerakDesertGravel
    - WGFloorMerakDesertSandrock
    - WGFloorMerakDesertCracked
    threshold: 0.15
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.05
      lacunarity: 5
      fractalType: FBm
      octaves: 2
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    entities: [MonoPlanetmapOreSandRich]
  - !type:BiomeDummyLayer
    id: Loot
  # Ground: the dune sea, then the regions on top of it.
  - !type:BiomeTileLayer
    threshold: -1
    tile: WGFloorMerakDuneSand
  - !type:BiomeTileLayer
    threshold: 0.1
    tile: WGFloorMerakGoldSand
    noise: { seed: 5, noiseType: OpenSimplex2, frequency: 0.005 }
  - !type:BiomeTileLayer
    threshold: 0.5
    tile: WGFloorMerakPaleSand
    noise: { seed: 6, noiseType: OpenSimplex2, frequency: 0.006 }
  - !type:BiomeMetaLayer
    threshold: 0.3
    template: WGMerakBadlands
    noise: { seed: 11, noiseType: OpenSimplex2, frequency: 0.006, fractalType: FBm, octaves: 3 }
  - !type:BiomeMetaLayer
    threshold: 0.3
    template: WGMerakGravelFlats
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 0.006, fractalType: FBm, octaves: 3 }
  - !type:BiomeMetaLayer
    threshold: 0.35
    template: WGMerakCactusFields
    noise: { seed: 23, noiseType: OpenSimplex2, frequency: 0.007, fractalType: FBm, octaves: 3 }
  - !type:BiomeMetaLayer
    threshold: 0.82
    template: WGMerakOasis
    noise: { seed: 41, noiseType: OpenSimplex2, frequency: 0.0075, fractalType: FBm, octaves: 2 }

- type: biomeTemplate
  id: WGMerakBadlands
  layers:
  # Wildlife: lizards and cobras
  # Dry scrub, black boulders and short mesas; later layers win.
  - !type:BiomeDecalLayer # LuaM: collisionless flora as decals
    threshold: 0.8
    noise: { seed: 12, noiseType: OpenSimplex2, frequency: 3 }
    allowedTiles: [WGFloorMerakRedDesertSand, WGFloorMerakRedDesertRock, WGFloorMerakRedDesertRockCracked, WGFloorMerakDarkSand]
    decals: [LuaMFloraCoyoteFloraWasteplantWildFeracactus, LuaMFloraCMFloraBushDesert, LuaMFloraCoyoteFloraWasteplantWildPrickly]
  - !type:BiomeEntityLayer
    threshold: 0.82
    noise: { seed: 13, noiseType: OpenSimplex2, frequency: 3 }
    allowedTiles: [WGFloorMerakRedDesertSand, WGFloorMerakRedDesertRock, WGFloorMerakRedDesertRockCracked, WGFloorMerakDarkSand]
    entities: [CMRockBlackGroundDense2, CMRockBlackGroundDense3, CMRockBlackGroundDense]
  - !type:BiomeEntityLayer
    threshold: 0.9
    noise: { seed: 18, noiseType: OpenSimplex2, frequency: 3 }
    allowedTiles: [WGFloorMerakRedDesertSand, WGFloorMerakRedDesertRock, WGFloorMerakRedDesertRockCracked, WGFloorMerakDarkSand]
    entities: [CMBouldersLargeBoulderdarkBoulderDark2, CMBouldersSmallboulderdarkBoulderDark3, CMRockBlackGroundDense4]
  # Spitting cacti (_WG/Planets/Life/merak.yml)
  - !type:BiomeEntityLayer
    threshold: 0.78
    noise: { seed: 14, noiseType: OpenSimplex2, frequency: 0.05, fractalType: FBm, octaves: 2 }
    allowedTiles: [WGFloorMerakRedDesertRock, WGFloorMerakRedDesertRockCracked]
    entities: [CMRockOrange]
  - !type:BiomeTileLayer
    threshold: -1
    tile: WGFloorMerakRedDesertSand
  - !type:BiomeTileLayer
    threshold: 0.15
    tile: WGFloorMerakRedDesertRock
    noise: { seed: 15, noiseType: OpenSimplex2, frequency: 0.012 }
  - !type:BiomeTileLayer
    threshold: 0.5
    tile: WGFloorMerakRedDesertRockCracked
    noise: { seed: 16, noiseType: OpenSimplex2, frequency: 0.015 }
  - !type:BiomeTileLayer
    threshold: 0.62
    tile: WGFloorMerakDarkSand
    noise: { seed: 17, noiseType: OpenSimplex2, frequency: 0.012 }

