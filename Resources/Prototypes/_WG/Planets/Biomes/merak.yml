    allowedTiles: [WGFloorMerakDesertGravel, WGFloorMerakDesertSandrock, WGFloorMerakDesertCracked]
    entities: [CoyoteChompBonesLribs, CoyoteChompBonesLskullW, CoyoteChompBonesLbone]
  - !type:BiomeTileLayer
