- type: biomeTemplate
  id: WGMerakCactusFields
  layers:
  # Wildlife: kangaroos. Same noise as the dune layer, so it replaces the dune table here.
  # Desert grass, shrubs, cacti and lone trees; later layers win.
  - !type:BiomeEntityLayer
    threshold: 0.45
    noise: { seed: 24, noiseType: OpenSimplex2, frequency: 0.3 }
    allowedTiles: [WGFloorMerakDuneSand, WGFloorMerakGoldSand, WGFloorMerakPaleSand]
    entities: [CMGrassDesertLightgrass5, CMGrassDesertHeavy, CMGrassDesertLightgrass7, AuroraFloraGrassDesert, CMGrassDesertLightgrass10]
  - !type:BiomeEntityLayer
    threshold: 0.72
    noise: { seed: 25, noiseType: OpenSimplex2, frequency: 3 }
    allowedTiles: [WGFloorMerakDuneSand, WGFloorMerakGoldSand, WGFloorMerakPaleSand]
    entities: [ChompFloraDesertPlanetShrub, ChompFloraDesertPlanetBush, CMFloraBushDesert, ChompFloraDesertPlanetThicket]
  - !type:BiomeEntityLayer
    threshold: 0.72
    noise: { seed: 28, noiseType: OpenSimplex2, frequency: 3 }
    allowedTiles: [WGFloorMerakDuneSand, WGFloorMerakGoldSand, WGFloorMerakPaleSand]
    entities: [CoyoteFloraWasteplantWildAgave, CoyoteFloraWasteplantWildYucca, CoyoteFloraWasteplantWildMesquite, CoyoteFloraWasteplantWildPinyon]
  - !type:BiomeEntityLayer
    threshold: 0.68
    noise: { seed: 26, noiseType: OpenSimplex2, frequency: 4 }
    allowedTiles: [WGFloorMerakDuneSand, WGFloorMerakGoldSand, WGFloorMerakPaleSand]
    entities: [ChompFloraDesertPlanetBarrelcacti, CoyoteFloraChompBarrelcacti1, CoyoteFloraChompBarrelcacti2, CoyoteFloraChompBarrelcacti3]
  - !type:BiomeEntityLayer
    threshold: 0.78
    noise: { seed: 29, noiseType: OpenSimplex2, frequency: 4 }
    allowedTiles: [WGFloorMerakDuneSand, WGFloorMerakGoldSand, WGFloorMerakPaleSand]
    entities: [CMDesertCactusMultiple, ChompFloraDesertPlanetLbarrelcacti, CMBushDesertCactus, CoyoteFloraChompLbarrelcacti1]
  # Living plants (_WG/Planets/Life/merak.yml): sting-nettle, tappable barrel cacti, agave
  - !type:BiomeEntityLayer
    threshold: 0.93
    noise: { seed: 27, noiseType: OpenSimplex2, frequency: 2 }
    allowedTiles: [WGFloorMerakDuneSand, WGFloorMerakGoldSand, WGFloorMerakPaleSand]
    entities: [ChompTreeDesertPlanetDesertTree1, AuroraFloraTreeDesert, ChompTreeDesertPlanetDesertTree3, CoyoteTreeChompLcactus]

# The halo is the pond's own noise one band below the water, so only real ponds get one.
- type: biomeTemplate
  id: WGMerakOasis
  layers:
  # Wildlife: goats and crabs, and very rarely a mimic
  # Desert grass, shade palms, bushes and reeds; later layers win.
  - !type:BiomeEntityLayer
    threshold: 0.1
    noise: { seed: 43, noiseType: OpenSimplex2, frequency: 0.25 }
    allowedTiles: [WGFloorMerakOasisDirt, WGFloorMerakOasisGrass]
    entities: [CMGrassDesertLightgrass7, CMGrassTallgrassDesert, CMGrassDesertLightgrass5, AuroraFloraGrassDesert]
  - !type:BiomeEntityLayer
    threshold: 0.7
    noise: { seed: 44, noiseType: OpenSimplex2, frequency: 0.3 }
    allowedTiles: [WGFloorMerakOasisDirt, WGFloorMerakOasisGrass]
    entities: [ChompFloraDesertPlanetPalmy, ChompFloraDesertPlanetBush, CoyoteFloraChompPalmy1]
  - !type:BiomeEntityLayer
    threshold: 0.7
    noise: { seed: 45, noiseType: OpenSimplex2, frequency: 0.3 }
    allowedTiles: [WGFloorMerakOasisDirt, WGFloorMerakOasisGrass]
    entities: [ChompTreeDesertPlanetMpalmtree, ChompTreeDesertPlanetPalmtree, TgFloraTreePalm, ChompTreeDesertPlanetSpalmtree]
  # Date palms in the thickest groves
  - !type:BiomeEntityLayer
    threshold: 0.875
    noise: { seed: 41, noiseType: OpenSimplex2, frequency: 0.0075, fractalType: FBm, octaves: 2 }
    allowedTiles: [WGFloorMerakOasisDirt, WGFloorMerakOasisGrass]
    entities: [AuroraFloraBushKonyangReeds]
  - !type:BiomeEntityLayer
    threshold: 0.9
    noise: { seed: 41, noiseType: OpenSimplex2, frequency: 0.0075, fractalType: FBm, octaves: 2 }
    allowedTiles: [WGFloorMerakOasisDirt, WGFloorMerakOasisGrass]
    entities: [MonoFloorWaterEntity]
  - !type:BiomeTileLayer
    threshold: -1
    tile: WGFloorMerakOasisDirt
  - !type:BiomeTileLayer
    threshold: 0.86
    tile: WGFloorMerakOasisGrass
    noise: { seed: 41, noiseType: OpenSimplex2, frequency: 0.0075, fractalType: FBm, octaves: 2 }
