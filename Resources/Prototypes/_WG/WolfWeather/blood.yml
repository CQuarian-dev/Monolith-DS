# Red weathers for Carcinoma, as variants of the normal rain and fog.
- type: wolfWeather
  parent: WGRainLight
  id: WGBloodRainLight
  groundTint: "#8c0a0d"
  ambientTint: "#f0c8c8"
  layerOverrides:
  - index: 0
    color: "#d0141cb3"
  - index: 1
    color: "#e0202ab3"

- type: wolfWeather
  parent: WGRainModerate
  id: WGBloodRainModerate
  groundTint: "#8c0a0d"
  ambientTint: "#e0b0b0"
  layerOverrides:
  - index: 0
    color: "#a80c14b3"
  - index: 1
    color: "#e01a22cc"
  - index: 2
    color: "#e0202acc"

- type: wolfWeather
  parent: WGRainHeavy
  id: WGBloodRainHeavy
  groundTint: "#8c0a0d"
  ambientTint: "#c89090"
  lightning:
    interval: 30, 90
    flashColor: "#ffd0c8"
    farSound:
      collection: WGWolfThunderFar
      params:
        volume: 0
        variation: 0.05
  layerOverrides:
  - index: 0
    color: "#a80c14bf"
  - index: 1
    color: "#d0141cd9"
  - index: 2
    color: "#f02830e6"
  - index: 3
    color: "#e0202ad9"

- type: wolfWeather
  parent: WGFogBank
  id: WGBloodFog
  ambientTint: "#d8a8a8ff"
  layerOverrides:
  - index: 0
    color: "#9a0f14b3"
  - index: 1
    color: "#c4141e80"

- type: wolfWeather
  parent: WGFogHaze
  id: WGBloodHaze
  ambientTint: "#e8c4c4ff"
  layerOverrides:
  - index: 0
    color: "#a3141a8c"
