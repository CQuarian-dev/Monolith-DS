- type: wgPlanetPoiTable
  id: WGPoisCarcinoma
  wrecks:
    theme: WGWreckThemeCarcinoma
    minCount: 2
    maxCount: 3
    # The world is small and its sites keep far from the edge; the wrecks need not.
    edgeMargin: 24
  difficulty: Extreme
  roads:
    tile: FloorDirt
    width: 3
    tunnels:
      wall: WallMeat
      clutter: [ WGFleshPolyp, MaterialBones1 ]
  minCount: 3
  maxCount: 3
  # The smallest world, and wet: at 96 and 72 a site could find no dry room between centreClear and edgeMargin.
  spacing: 64
  footprint: 24
  edgeMargin: 48
  centreClear: 64
