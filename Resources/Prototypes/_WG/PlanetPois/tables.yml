# Every world keeps its procedural dungeons beside the authored sites. On Verda they sit off the roads, which join the
# house and the gas station; elsewhere the roads join the dungeons.
# The mechanic's garage and the roadside inn carry their own strip of asphalt, so they go only on the paved worlds:
# always on Verda, now and then on Merak. The hospital sits on its own stretch of road too, on Verda alone: its grounds
# are Verda's crocus grass.
# A site that finds no room is skipped, so the counts are ceilings.
# Armour (the Reaver APC road patrols) drives only Verda's and Merak's roads; the other worlds keep their parked
# civilian vehicles and nothing heavier.

- type: wgPlanetPoiTable
  id: WGPoisAsclepiu
  wrecks:
    theme: WGWreckThemeVerda
    minCount: 1
    maxCount: 2
  difficulty: Moderate
  roads:
    # Few roads join few sites, so a site off them can be well out: its footpath reaches that far.
    trailLength: 480
    tile: RMCPlanetHybrisaAsphalt
    width: 5
    shoulderTile: RMCPlanetHybrisaSidewalk
    shoulderWidth: 1
    dressing: WGRoadDressingAsclepiu
    tunnels:
      wall: WallRock
      clutter: [ SpiderWeb, MaterialBones1 ]
  minCount: 7
  maxCount: 11
  entries:
  - mapPath: /Maps/_WG/PlanetPois/atalis_house.yml
    name: wg-poi-atalis-house
    expeditions: false
    footprint: -16,2,1,15
    minCount: 1
    maxCount: 1
    connection: Isolated
    trail: true
    dwelling: true
    sockets:
    - offset: -10,4
      direction: South
    rotate: true
    below: /Maps/_WG/PlanetPois/atalis_house_below.yml
  - mapPath: /Maps/_WG/PlanetPois/planetary_vault.yml
