# Hand-written: the spawn-menu category and the two tile bases the generated tile files parent to.

- type: entityCategory
  id: WGStreets
  name: wg-streets-entity-category

- type: entityCategory
  id: WGStreetsBuildings
  name: wg-streets-entity-category-buildings

- type: entityCategory
  id: WGStreetsFurniture
  name: wg-streets-entity-category-furniture

- type: entityCategory
  id: WGStreetsLighting
  name: wg-streets-entity-category-lighting

- type: entityCategory
  id: WGStreetsSigns
  name: wg-streets-entity-category-signs

- type: entityCategory
  id: WGStreetsYards
  name: wg-streets-entity-category-yards

# Roads, pavements and bare ground: open to the weather, and not pried up.
- type: tile
  abstract: true
  id: WGStreetsOutdoorTile
  # Road lines, kerbs and markings turn with a turned site or a mapper's rotation.
  allowRotationMirror: true
  baseTurf: FloorDirt
  isSubfloor: false
  deconstructTools: []
  footstepSounds:
    collection: FootstepTile
  heatCapacity: 10000
  weather: true

# Shop, office and hall floors.
- type: tile
  abstract: true
  id: WGStreetsIndoorTile
  allowRotationMirror: true
  baseTurf: Plating
  isSubfloor: false
  deconstructTools: [ Prying ]
  footstepSounds:
    collection: FootstepFloor
  heatCapacity: 10000
